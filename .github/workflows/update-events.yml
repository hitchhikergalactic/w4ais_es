name: Update events

# Cada día lee el calendario de Luma de W4AIS y guarda los próximos eventos en src/data/events.json.
# Si hay cambios, los sube a main y Vercel vuelve a publicar la web con las fechas nuevas.
# Ese despliegue diario también mueve a «Past events» los eventos de los capítulos que ya han pasado.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-events.mjs
      - name: Publish if there are changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/events.json
          git commit -m "Events: upcoming events from Luma"
          git push
